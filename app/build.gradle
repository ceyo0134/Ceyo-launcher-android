plugins { id 'com.android.application' }

android {
    namespace 'com.ceyo.launcher'
    compileSdk 34
    defaultConfig {
        applicationId "com.ceyo.launcher"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
