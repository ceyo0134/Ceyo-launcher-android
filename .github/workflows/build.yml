name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            grep -E "error:|\.java:[0-9]+|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ceyo-launcher
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release (telefondan indirmek için)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CeyoLauncher.apk
          gh release create "build-${{ github.run_number }}" CeyoLauncher.apk \
            --title "Ceyo Launcher build ${{ github.run_number }}" \
            --notes "Otomatik derleme" --latest
